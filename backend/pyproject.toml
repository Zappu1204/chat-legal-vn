[project]
name = "chat-legal-vn-backend"
version = "0.1.0"
description = "Web delivery layer (FastAPI) for chat-legal-vn — auth, RBAC, dynamic config, streaming chat with sources"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    # The RAG core (installed editable from the repo root in dev).
    "chat-legal-vn",
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # DB / ORM (async)
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # Auth / security
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # Config
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the `app` package is the distributable backend; `alembic/` (migrations)
# and `tests/` are intentionally excluded from the wheel.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
