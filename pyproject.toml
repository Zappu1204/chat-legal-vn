[project]
name = "chat-legal-vn"
version = "0.1.0"
description = "Vietnamese Legal Document RAG QA system — Adapter-first Clean Architecture, Hybrid Retrieval + Reranker + GraphRAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "chat-legal-vn" },
]
license = { text = "Apache-2.0" }

dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "structlog>=24.4",
    # HTTP / OpenAI-compatible clients
    "httpx>=0.27",
    "openai>=1.51",
    "aiohttp>=3.10",
    # Data processing
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # Stores
    "qdrant-client>=1.12",
    "elasticsearch>=8.15,<9",
    "neo4j>=5.24",
    # Web (optional)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]

[project.scripts]
chat-legal-vn = "chat_legal_vn.cli:app"
# Short alias — same entry point, less typing.
clvn = "chat_legal_vn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_legal_vn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL", "PT"]
ignore = [
    "PLR0913",   # too-many-arguments — we use kwarg-rich constructors
    "PLR2004",   # magic numbers in tests
    "PLR0911",   # too-many-return-statements
    "PLR0912",   # too-many-branches
    "PLR0915",   # too-many-statements
    "E501",      # long lines
    "RUF001",    # ambiguous Unicode (intentional in Vietnamese strings)
    "RUF002",    # ambiguous Unicode in docstrings
    "RUF003",    # ambiguous Unicode in comments
    "PT018",     # multi-part assert (readable as one condition)
    "PLC0206",   # for-key-in-dict iteration style
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
