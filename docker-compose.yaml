version: '3.8'

services:
  ###########################################################################
  # QDRANT – VECTOR STORE
  ###########################################################################
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "qdrant-6qht7h1sp71D5SlgXZgKWw0HO7vDY5dP"
      QDRANT__SERVICE__GRPC_PORT: 6334

  ###########################################################################
  # ELASTICSEARCH – LEXICAL STORE (BM25)
  ###########################################################################
  elasticsearch:
    image: elasticsearch:8.19.15
    container_name: elasticsearch
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - ELASTIC_PASSWORD=zxrGL77CGKjJKPF3nOdufHwUtziaKY77
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      # Auto-install analysis-icu on first boot (used by vi_legal_analyzer).
      - ES_PLUGINS_INSTALL=analysis-icu
    ports:
      - "9200:9200"   # REST API
      - "9300:9300"   # Transport
    volumes:
      - ./elastic_data:/usr/share/elasticsearch/data
    # Install plugin if missing on every container start (idempotent).
    command: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-icu ]; then
          bin/elasticsearch-plugin install --batch analysis-icu;
        fi;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "

  ###########################################################################
  # NEO4J – GRAPH STORE
  ###########################################################################
  neo4j:
    image: neo4j:5.26.26
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "neo4j/jYPmLbX1MjXbnQZQoPinM8HDlArn3FL9"
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs

  ###########################################################################
  # POSTGRES – APPLICATION DB (users, conversations, system_config)
  ###########################################################################
  postgres:
    image: postgres:17.2
    container_name: clvn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clvn
      POSTGRES_PASSWORD: clvn
      POSTGRES_DB: clvn
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clvn -d clvn"]
      interval: 10s
      timeout: 5s
      retries: 5
